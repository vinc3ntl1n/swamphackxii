<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pulse.</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">
<script type="module" src="wifi.js"></script>
<style>
  /* A fixed 1280x720 card, scaled to fit the window, for screenshots and video thumbnails. */
  body.friendly-page {
    height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .thumb {
    position: relative;
    z-index: 1;
    width: 1280px;
    height: 720px;
    flex: none;
    transform: scale(var(--fit, 1));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--ink);
  }

  .thumb .brand {
    gap: 28px;
    font-size: 132px;
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  .thumb .brand-logo {
    height: 100px;
    filter: drop-shadow(0 8px 10px rgba(15, 42, 26, 0.25));
  }

  .thumb .brand-wifi {
    margin-left: -30px;
  }

  .thumb-tag {
    margin: 56px 0 0;
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }

  .thumb-tag em {
    font-style: normal;
    color: var(--calm);
  }

  .thumb-sub {
    margin: 22px 0 0;
    font-size: 30px;
    font-weight: 500;
    color: var(--ink-2);
  }
</style>
</head>
<body class="friendly-page">
<canvas class="bg-dots" id="bg" aria-hidden="true"></canvas>

<main class="thumb">
  <span class="brand"><img class="brand-logo" src="gator_side.png" alt=""><pulse-wifi class="brand-wifi" dir="70"></pulse-wifi>pulse.</span>
  <h1 class="thumb-tag">Peace of mind, with <em>privacy</em> in mind.</h1>
  <p class="thumb-sub">Camera-free fall detection powered by Wi-Fi signals.</p>
</main>

<script>
const thumb = document.querySelector(".thumb");
const bg = document.getElementById("bg");
const ctx = bg.getContext("2d");
// Same palette and projection as the dashboard's moving dots, frozen in place.
const DOT_COLORS = ["18,84,46", "31,122,67", "47,125,75", "76,175,110", "112,196,140", "160,214,170"];

let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const dots = Array.from({ length: 300 }, (_, i) => ({
  x: rand() * 2 - 1, y: rand() * 2 - 1, z: rand() * 2 - 1,
  c: DOT_COLORS[i % DOT_COLORS.length], s: 0.6 + rand() * 0.9,
}));

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth;
  const h = innerHeight;
  thumb.style.setProperty("--fit", Math.min(w / 1280, h / 720));
  bg.width = Math.round(w * dpr);
  bg.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const yaw = 0.4;
  const pitch = -0.18;
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  for (const d of dots) {
    const x1 = d.x * cy - d.z * sy;
    const z1 = d.x * sy + d.z * cy;
    const y1 = d.y * cp - z1 * sp;
    const z2 = d.y * sp + z1 * cp;
    const persp = 1.6 / (z2 + 2.6);
    const x = w / 2 + x1 * persp * w * 0.95;
    const y = h / 2 + y1 * persp * h * 1.05;
    ctx.fillStyle = `rgba(${d.c},${0.25 + persp * 0.35})`;
    ctx.beginPath();
    ctx.arc(x, y, d.s * persp * 2.4, 0, Math.PI * 2);
    ctx.fill();
  }
}

addEventListener("resize", draw);
draw();
</script>
</body>
</html>
